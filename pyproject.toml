[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citewise-mini-project"
version = "0.1.0"
description = "Evidence retrieval on real QASPER scientific papers with reproducible evaluation"
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.0,<5",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.3,<6", "torch>=2.2"]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citewise = ["index.html", "research_summary.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
